name: Pipeline Node.js

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-laterst

    steps:
      - name: Checkout
        uses: actions/Checkout@v4

      - name: Istalar Node.js
        uses: action/setup-node@v4
        with:
          node-version: 20
      
      - name: Instalar as dependências
        run: npm install
        working-directory: ./app

      - name: Adicionar os envs
        env:  
          DB_HOST: ${{secret.DB_HOST }}
          DB_USER: ${{secret.DB_USER }}
          DB_PASSWORD: ${{secret.APP_VERSION }}
          APP_VERSION: ${{secret.APP_VERSION }}
          ENVIROMENT: ${{secret.ENVIROMENT }}
        
        run: | 
          timeout 10s npm start
        working-directory: ./app

      - name: Exibir secrets mascarados
        run: |
          echo "DB_HOST=${{ secret.DB_HOST }}"
          echo "DB_USER=${{ secret.DB_USER }}"
          echo "APP_VERSION=${{ secret.APP_VERSION }}"
          echo "ENVIROMENT=${{ secret.ENVIROMENT }}"
        
      -name: Pipeline finalizada
      run: echo "Deploy executada com sucesso!"
          
    
      